server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: codecraft-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  servlet:
    multipart:
      enabled: true
      # Per-kind limits are enforced in FileStorageService (video 500MB, material 50MB, image 10MB);
      # these are the transport-level ceilings.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:512MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:520MB}

# ==========================================
# CodeCraft Custom Application Properties
# ==========================================
app:
  jwt:
    secret: ${JWT_SECRET:9a7f3c2e1d8b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1b2a3f4e5d6c7b8a9f0e1d2c3b4a5}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    issuer: CodeCraftAuth
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost:3000}
  storage:
    # Local directory for uploaded course assets (videos, materials, thumbnails). Served at /uploads/**.
    local-dir: ${UPLOAD_DIR:uploads}
  sandbox:
    provider: ${SANDBOX_PROVIDER:LOCAL} # Options: LOCAL | DOCKER
    default-timeout-ms: ${EXECUTION_TIMEOUT_MS:2000}
    default-memory-limit-mb: ${MEMORY_LIMIT_MB:256}
  bootstrap:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:Sanju@gmail.com}
      password: ${SUPER_ADMIN_PASSWORD:12345678}
      username: ${SUPER_ADMIN_USERNAME:SanjuAdmin}
      full-name: ${SUPER_ADMIN_FULLNAME:Sanju Kumar}

# ==========================================
# Springdoc / OpenAPI Configuration
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# ==========================================
# Actuator Health & Monitoring
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
