spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:codecraft_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false # Disabled in basic unit test profile
